services:
  mysql:
    image: mysql:8.0
    container_name: tripmap-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tripMap
      MYSQL_USER: tripMap
      MYSQL_PASSWORD: P@ssword!
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql-data: